org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
android.useAndroidX=true

# The Maven coordinates: software.aws.connect:<module>:<version>, beside the Connect chat SDK this
# package wraps (software.aws.connect:amazon-connect-chat-android). A release sets `version` and its
# CHANGELOG.md section together.
group=software.aws.connect
version=0.1.1

# What every published POM says.
POM_URL=https://github.com/amazon-connect/touchpoint-android
POM_SCM_CONNECTION=scm:git:https://github.com/amazon-connect/touchpoint-android.git
