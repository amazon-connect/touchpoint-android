name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push supersedes a pull request's run. Each commit on main gets its own group, so every
  # one finishes: a release tags only a commit whose main run is green.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # A stable name: branch protection and the release workflow require it.
    name: make check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: corretto
          java-version: "17"

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.1.0" > /dev/null

      # Caches Gradle's dependencies and validates the wrapper's checksum. Saved only from main, so
      # pull requests don't evict each other.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: make check
        run: make check

      # A pull request that changes the version is a release pull request: check now what the release
      # workflow will check once the tag is pushed, when it can no longer be undone.
      - name: Release readiness
        if: github.event_name == 'pull_request'
        run: |
          version=$(sed -n 's/^version=\(.*\)$/\1/p' gradle.properties)
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          base=$(git show "FETCH_HEAD:gradle.properties" | sed -n 's/^version=\(.*\)$/\1/p')
          if [ "$version" = "$base" ]; then echo "not a release pull request ($version)"; exit 0; fi
          echo "release pull request: $base -> $version"
          sh Scripts/check-release-tag.sh "v$version"
